<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bank Transfer System</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar"><h1>Bank Transfer System</h1></header>
<main>
  <div class="alert success" th:if="${success}" th:text="${success}"></div>
  <div class="alert error" th:if="${error}" th:text="${error}"></div>

  <section class="stats">
    <div>Total balance<br><b>LKR <span th:text="${#numbers.formatDecimal(totalBalance,1,'COMMA',2,'POINT')}"></span></b></div>
    <div>Customers<br><b th:text="${customerCount}"></b></div>
    <div>Successful<br><b th:text="${successCount}"></b></div>
    <div>Failed<br><b th:text="${failedCount}"></b></div>
  </section>

  <section>
    <h2>Transfer money</h2>
    <form th:action="@{/transfer}" th:object="${transferRequest}" method="post">
      <input th:field="*{fromAccount}" placeholder="From account">
      <span class="field-error" th:if="${#fields.hasErrors('fromAccount')}" th:errors="*{fromAccount}"></span>
      <input th:field="*{toAccount}" placeholder="To account">
      <span class="field-error" th:if="${#fields.hasErrors('toAccount')}" th:errors="*{toAccount}"></span>
      <input th:field="*{amount}" placeholder="Amount">
      <span class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></span>
      <label><input type="checkbox" th:field="*{simulateFailure}"> Simulate a system failure</label>
      <button type="submit">Transfer</button>
    </form>
  </section>

  <section>
    <h2>Customers</h2>
    <form th:action="@{/}" method="get">
      <input name="keyword" th:value="${keyword}" placeholder="Search by name">
      <button type="submit">Search</button>
    </form>
    <table>
      <tr><th>Account</th><th>Name</th><th>Email</th><th>Balance (LKR)</th><th></th></tr>
      <tr th:each="c : ${customers}">
        <td th:text="${c.accountNumber}"></td>
        <td th:text="${c.fullName}"></td>
        <td th:text="${c.email}"></td>
        <td th:text="${#numbers.formatDecimal(c.balance,1,'COMMA',2,'POINT')}"></td>
        <td><a th:href="@{/accounts/{n}/history(n=${c.accountNumber})}">View</a></td>
      </tr>
    </table>

    <h3>Add customer</h3>
    <form th:action="@{/customers}" method="post">
      <input name="accountNumber" placeholder="Account number" required>
      <input name="fullName" placeholder="Full name" required>
      <input name="email" placeholder="Email">
      <input name="balance" type="number" step="0.01" min="0" placeholder="Opening balance" required>
      <button type="submit">Add</button>
    </form>
  </section>

  <section>
    <h2>Latest transactions</h2>
    <table>
      <tr><th>ID</th><th>Time</th><th>From</th><th>To</th><th>Amount</th><th>Status</th><th>Description</th></tr>
      <tr th:each="t : ${transactions}">
        <td th:text="${t.id}"></td>
        <td th:text="${#temporals.format(t.createdAt,'yyyy-MM-dd HH:mm:ss')}"></td>
        <td th:text="${t.fromAccount}"></td>
        <td th:text="${t.toAccount}"></td>
        <td th:text="${t.amount}"></td>
        <td th:text="${t.status}" th:class="${t.status.name() == 'SUCCESS'} ? 'ok' : 'bad'"></td>
        <td th:text="${t.description}"></td>
      </tr>
    </table>
  </section>
</main>
</body>
</html>
